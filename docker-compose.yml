services:
  kiosk:
    build: .
    container_name: kuveyt-turk-kiosk
    ports:
      - "8080:8080"          # TV: http://<sunucu-ip>:8080/  · Panel: /control
    volumes:
      - kiosk-data:/data     # ayarlar burada kalıcı olur (yeniden başlatmada korunur)
    restart: unless-stopped

volumes:
  kiosk-data:
